# Financy documentation site (Hugo), deployed under /financy/docs/.
baseURL: "https://raihanstark.github.io/financy/docs/"
title: "Financy Manual"
languageCode: "en-us"

enableInlineShortcodes: true
enableGitInfo: false

# Docs site — no blog-style taxonomies (avoids stray /tags/ and /categories/).
disableKinds: [taxonomy, term, RSS, sitemap]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

params:
  version: "v0.14.0"
  repoURL: "https://github.com/raihanstark/financy"
  mainSiteURL: "../"
